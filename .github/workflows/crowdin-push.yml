name: Crowdin mobile source push

on:
  push:
    paths:
        - 'translation/source/mobile.xml'
    branches: [ main ]
  workflow_dispatch:

jobs:
  crowdin-push:
    runs-on: ubuntu-latest
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
    steps:
      - name: Check secret availability
        id: check_secret
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check_secret.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crowdin push
        if: steps.check_secret.outputs.skip != 'true'
        uses: crowdin/github-action@c7af9bc98b01694653031fef2a0dc6c7888ce9bc # v2.17.0
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          source: translation/source/mobile.xml
          translation: /translation/dest/%file_name%/%locale%.%file_extension%
          crowdin_branch_name: '[lichess-org.mobile] main'
          upload_sources_args: '--preserve-hierarchy'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
